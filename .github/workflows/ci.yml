# Testes e builds automáticos do PIPA BRASIL.
# A cada envio de código: baixa o Godot, roda os testes sem tela e, se passarem
# no ramo main, gera Android (APK), Windows e Web e publica na release
# "ultima-versao".

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: "stable"

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux

      - name: Baixar o Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p ~/godot-bin
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${V}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Preparar o Godot
        run: |
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          ~/godot-bin/godot --version

      - name: Importar o projeto
        run: |
          timeout 300 godot --headless --path . --import 2>&1 | tee import.log || true
          # o importador às vezes cai no meio ("double free"); repete até 3 vezes
          for n in 1 2 3; do timeout 300 godot --headless --path . --import 2>&1 | tail -2 || true; done
          test -d .godot || (echo "A importação não criou a pasta .godot" && exit 1)

      - name: Rodar os testes
        run: |
          set -o pipefail
          timeout 1200 godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee testes.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" testes.log; then
            echo "::error::Erro de script durante os testes (veja acima)."
            exit 1
          fi

      - name: Publicar referências de regressão novas
        if: github.ref == 'refs/heads/main'
        run: |
          NOVAS=$(git status --porcelain --untracked-files=all tests/golden | wc -l)
          if [ "$NOVAS" -gt 0 ]; then
            echo "Referências novas: $NOVAS"
            mkdir -p /tmp/ref && cp tests/golden/*.csv /tmp/ref/
            cd /tmp/ref
            git init -q -b referencias-novas
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -q -m "Referências geradas no commit ${GITHUB_SHA::7}"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" referencias-novas
          fi

  builds:
    name: Builds (Android, Windows, Web)
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot e modelos de exportação
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/godot-templates
          key: godot-export-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Baixar o Godot e os modelos de exportação
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p ~/godot-bin ~/godot-templates
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${V}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -fsSL --retry 3 -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q templates.tpz -d ~/godot-templates

      - name: Instalar os modelos de exportação
        run: |
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          TV=$(head -n1 ~/godot-templates/templates/version.txt | tr -d '[:space:]')
          echo "Versão dos modelos: $TV"
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot-templates/templates ~/.local/share/godot/export_templates/$TV

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android (SDK e chave de depuração)
        run: |
          KS="$HOME/debug.keystore"
          keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK Android: $SDK"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres "editor_settings-${GODOT_VERSION}.tres"; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Marcar o build com o commit
        run: |
          SHORT="${GITHUB_SHA::7}"
          sed -i "s/const COMMIT := \"dev\"/const COMMIT := \"${SHORT}\"/" game/main/build_info.gd
          cat game/main/build_info.gd

      - name: Importar o projeto
        run: |
          timeout 300 godot --headless --path . --import 2>&1 | tee import.log || true
          # o importador às vezes cai no meio ("double free"); repete até 3 vezes
          for n in 1 2 3; do timeout 300 godot --headless --path . --import 2>&1 | tail -2 || true; done
          test -d .godot

      - name: Exportar Android
        run: |
          mkdir -p build/android
          timeout 600 godot --headless --path . --export-debug "Android" build/android/pipa-brasil.apk 2>&1 | tee android.log
          test -s build/android/pipa-brasil.apk

      - name: Exportar Windows
        run: |
          mkdir -p build/windows
          timeout 600 godot --headless --path . --export-release "Windows Desktop" build/windows/pipa-brasil.exe 2>&1 | tee windows.log
          test -s build/windows/pipa-brasil.exe
          (cd build/windows && zip -q -r ../pipa-brasil-windows.zip .)

      - name: Exportar Web
        run: |
          mkdir -p build/web
          timeout 600 godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee web.log
          test -s build/web/index.html
          # D-084: o jogo compara com este arquivo para saber se há versão nova
          grep -oP 'config/version="\K[^"]+' project.godot > build/web/versao.txt
          cat build/web/versao.txt
          (cd build/web && zip -q -r ../pipa-brasil-web.zip .)

      - name: Preparar a página para jogar no navegador (iPhone)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Guardar os builds no Actions
        uses: actions/upload-artifact@v4
        with:
          name: pipa-brasil-builds
          retention-days: 7
          path: |
            build/android/pipa-brasil.apk
            build/pipa-brasil-windows.zip
            build/pipa-brasil-web.zip

      - name: Publicar na release "ultima-versao"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao \
            build/android/pipa-brasil.apk \
            build/pipa-brasil-windows.zip \
            build/pipa-brasil-web.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Última versão (automática)" \
            --notes "Build automático do commit ${SHORT}, gerado depois que todos os testes passaram. Android: pipa-brasil.apk. Windows: pipa-brasil-windows.zip. Como instalar: docs/como-testar.md."

  pagina:
    name: Publicar a página para jogar (GitHub Pages)
    needs: builds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Só funciona com o repositório público e o Pages ligado em
    # Settings > Pages > Source: GitHub Actions. Sem isso, falha sem travar o resto.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4

  capturas:
    name: Capturas de tela (para conferir o visual)
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux

      - name: Baixar o Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p ~/godot-bin
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${V}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Preparar renderização por software
        run: |
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null

      - name: Importar o projeto
        run: |
          for n in 1 2 3 4; do timeout 300 godot --headless --path . --import 2>&1 | tail -2 || true; done

      - name: Gravar quadros da partida e do laboratório
        run: |
          mkdir -p capturas
          # Modo livre (cena principal), celular deitado: um bot pilota a sua pipa.
          for vista in primeira maos largada terceira praia inicio escolha; do
            mkdir -p "quadros_$vista"
            extra=""
            if [ "$vista" = terceira ]; then extra="--terceira"; fi
            if [ "$vista" = praia ]; then extra="--terceira --mapa=praia --hora=meio_dia"; fi
            if [ "$vista" = inicio ]; then extra="--inicio --hora=manha"; fi
            if [ "$vista" = escolha ]; then extra="--escolha"; fi
            if [ "$vista" = maos ]; then extra="--vitrine-maos"; fi
            if [ "$vista" = largada ]; then extra="--largada"; fi
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . \
              --rendering-method gl_compatibility --resolution 1280x720 \
              --fixed-fps 15 --quit-after 330 --write-movie "quadros_$vista/q.png" \
              -- --auto $extra 2>&1 | tail -5 || true
            quadros="00000030 00000150 00000329"
            # mãos (D-089): parado, puxando, mandando, desbicando, amarrando, erguendo
            if [ "$vista" = maos ]; then quadros="00000045 00000090 00000105 00000150 00000165 00000182 00000190 00000260 00000320"; fi
            if [ "$vista" = largada ]; then quadros="00000010 00000025 00000035 00000048 00000060 00000075 00000110 00000200"; fi
            for n in $quadros; do
              if [ -f "quadros_$vista/q$n.png" ]; then cp "quadros_$vista/q$n.png" "capturas/livre_${vista}_quadro${n}.png"; fi
            done
          done
          # Laboratório de voo (agora aberto pelo botão "Lab").
          mkdir -p quadros_lab
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . \
            --rendering-method gl_compatibility --resolution 1280x720 \
            --fixed-fps 15 --quit-after 120 --write-movie "quadros_lab/q.png" \
            res://scenes/lab/lab.tscn -- --camera=1 --rival --auto 2>&1 | tail -5 || true
          if [ -f quadros_lab/q00000119.png ]; then cp quadros_lab/q00000119.png capturas/laboratorio_quadro00000119.png; fi
          ls -la capturas

      - name: Guardar as capturas
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-tela
          retention-days: 7
          path: capturas/

      - name: Publicar as capturas no ramo "capturas"
        if: github.ref == 'refs/heads/main'
        run: |
          cd capturas
          git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Capturas automáticas do commit ${GITHUB_SHA::7}" > LEIA-ME.txt
          git add -A
          git commit -q -m "Capturas do commit ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
