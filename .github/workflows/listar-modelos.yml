# Lista os modelos 3D CC0 do Poly Haven (só para consulta, D-068).
name: Listar modelos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/listar_modelos.py
jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/listar_modelos.py
